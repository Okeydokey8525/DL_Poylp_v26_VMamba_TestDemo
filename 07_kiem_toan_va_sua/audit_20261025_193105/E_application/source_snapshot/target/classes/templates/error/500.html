<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Không thể xử lý yêu cầu')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="error-main" tabindex="-1">
    <section class="container error-state" aria-labelledby="errorTitle">
        <span class="error-code" aria-hidden="true">500</span>
        <div class="error-icon"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i></div>
        <h1 id="errorTitle">Không thể xử lý yêu cầu</h1>
        <p>Hệ thống gặp sự cố tạm thời. Vui lòng thử lại hoặc quay về trang chủ; chi tiết kỹ thuật đã được ẩn.</p>
        <p class="error-request-id" th:if="${requestId != null}">Mã yêu cầu: <code th:text="${requestId}"></code></p>
        <div class="error-actions">
            <a class="btn btn-primary" href=""><i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Thử lại</a>
            <a class="btn btn-outline-primary" th:href="@{/}">Về trang chủ</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
