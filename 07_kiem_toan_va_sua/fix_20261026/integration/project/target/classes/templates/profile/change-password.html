<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" class="auth-main" tabindex="-1">
    <div class="container">
        <section class="account-panel password-panel" aria-labelledby="passwordFormTitle">
            <a class="back-home" th:href="@{/profile}">
                <i class="bi bi-arrow-left" aria-hidden="true"></i> Quay lại hồ sơ
            </a>
            <div class="account-panel-heading">
                <span>Bảo mật tài khoản</span>
                <h1 id="passwordFormTitle">Đổi mật khẩu</h1>
                <p>Mật khẩu mới phải có 8–72 ký tự, gồm ít nhất một chữ và một số.</p>
            </div>
            <form th:action="@{/profile/change-password}" th:object="${passwordForm}" method="post"
                  class="auth-form" novalidate>
                <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">
                        Không thể đổi mật khẩu.
                    </div>
                </div>
                <div>
                    <label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
                    <input class="form-control" type="password" id="currentPassword" name="currentPassword"
                           autocomplete="current-password"
                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:errors="*{currentPassword}">Vui lòng nhập mật khẩu hiện tại.</div>
                </div>
                <div>
                    <label class="form-label" for="newPassword">Mật khẩu mới</label>
                    <input class="form-control" type="password" id="newPassword" name="newPassword"
                           autocomplete="new-password" minlength="8" maxlength="72"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:errors="*{newPassword}">Mật khẩu mới chưa hợp lệ.</div>
                </div>
                <div>
                    <label class="form-label" for="confirmNewPassword">Xác nhận mật khẩu mới</label>
                    <input class="form-control" type="password" id="confirmNewPassword" name="confirmNewPassword"
                           autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('confirmNewPassword')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:errors="*{confirmNewPassword}">
                        Mật khẩu xác nhận chưa khớp.
                    </div>
                </div>
                <button class="btn btn-primary w-100" type="submit">
                    <i class="bi bi-shield-lock" aria-hidden="true"></i> Cập nhật mật khẩu
                </button>
            </form>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
