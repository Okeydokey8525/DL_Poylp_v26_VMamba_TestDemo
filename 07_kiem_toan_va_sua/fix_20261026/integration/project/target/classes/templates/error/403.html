<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Không có quyền truy cập')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="error-main" tabindex="-1">
    <section class="container error-state" aria-labelledby="errorTitle">
        <span class="error-code" aria-hidden="true">403</span>
        <div class="error-icon"><i class="bi bi-shield-lock" aria-hidden="true"></i></div>
        <h1 id="errorTitle">Không có quyền truy cập</h1>
        <p>Tài khoản hiện tại không được phép xem hoặc thay đổi tài nguyên này.</p>
        <p class="error-request-id" th:if="${requestId != null}">Mã yêu cầu: <code th:text="${requestId}"></code></p>
        <div class="error-actions">
            <a class="btn btn-primary" th:href="@{/}">
                <i class="bi bi-house" aria-hidden="true"></i> Về trang chủ
            </a>
            <a class="btn btn-outline-primary" th:if="${currentUser != null}" th:href="@{/history}">
                Về lịch sử của tôi
            </a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
