<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Dịch vụ tạm thời chưa sẵn sàng')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="error-main" tabindex="-1">
    <section class="container error-state" aria-labelledby="errorTitle">
        <span class="error-code" aria-hidden="true">503</span>
        <div class="error-icon"><i class="bi bi-hdd-network" aria-hidden="true"></i></div>
        <h1 id="errorTitle">Dịch vụ tạm thời chưa sẵn sàng</h1>
        <p>Một thành phần của hệ thống đang gián đoạn. Hãy chờ ít phút rồi thử lại.</p>
        <p class="error-request-id" th:if="${requestId != null}">Mã yêu cầu: <code th:text="${requestId}"></code></p>
        <div class="error-actions">
            <a class="btn btn-primary" href=""><i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Thử lại</a>
            <a class="btn btn-outline-primary" th:href="@{/}">Về trang chủ</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
