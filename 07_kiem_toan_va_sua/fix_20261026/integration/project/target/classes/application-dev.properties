spring.config.activate.on-profile=dev

spring.mongodb.uri=${POLYPVISION_MONGODB_URI:mongodb://localhost:27017/polypweb}
ai.api.base-url=${POLYPVISION_AI_BASE_URL:http://localhost:8000}
ai.api.connect-timeout=${POLYPVISION_AI_CONNECT_TIMEOUT:3s}
ai.api.read-timeout=${POLYPVISION_AI_READ_TIMEOUT:15s}
ai.api.health-timeout=${POLYPVISION_AI_HEALTH_TIMEOUT:2s}
app.storage.root=${POLYPVISION_STORAGE_ROOT:storage}

spring.thymeleaf.cache=false
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
server.servlet.session.cookie.secure=false

logging.level.root=INFO
logging.level.com.polyp.polypweb=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:-startup}] %logger{36} - %msg%n
