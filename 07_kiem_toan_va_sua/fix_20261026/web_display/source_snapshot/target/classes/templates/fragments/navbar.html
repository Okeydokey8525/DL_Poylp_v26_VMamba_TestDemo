<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar">
    <a class="skip-link" href="#main-content">Chuyển tới nội dung chính</a>
    <nav class="navbar navbar-expand-lg app-navbar sticky-top" aria-label="Điều hướng chính">
        <div class="container">
            <a class="navbar-brand brand-lockup" th:href="@{/}" aria-label="PolypVision - Trang chủ">
                <span class="brand-mark" aria-hidden="true"><i class="bi bi-bounding-box-circles"></i></span>
                <span>Polyp<span class="brand-accent">Vision</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation" aria-expanded="false" aria-label="Mở menu điều hướng">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"
                           th:classappend="${activeNav == 'home'} ? 'active' : ''">Trang chủ</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null}">
                        <a class="nav-link" th:href="@{/dashboard}"
                           th:classappend="${activeNav == 'dashboard'} ? 'active' : ''">Tổng quan</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null}">
                        <a class="nav-link" th:href="@{/diagnose}"
                           th:classappend="${activeNav == 'diagnose'} ? 'active' : ''">Phân tích</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null}">
                        <a class="nav-link" th:href="@{/compare}"
                           th:classappend="${activeNav == 'compare'} ? 'active' : ''">So sánh</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null}">
                        <a class="nav-link" th:href="@{/history}"
                           th:classappend="${activeNav == 'history'} ? 'active' : ''">Lịch sử</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null}">
                        <a class="nav-link" th:href="@{/comparisons}"
                           th:classappend="${activeNav == 'comparisons'} ? 'active' : ''">Lịch sử so sánh</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/about}"
                           th:classappend="${activeNav == 'about'} ? 'active' : ''">Giới thiệu</a>
                    </li>
                </ul>
                <div class="nav-actions">
                    <div class="dropdown theme-switcher">
                        <button class="btn theme-toggle dropdown-toggle" type="button" id="themeMenuButton"
                                data-bs-toggle="dropdown" aria-expanded="false"
                                aria-label="Chọn giao diện sáng, tối hoặc theo hệ thống">
                            <i class="bi bi-circle-half" data-theme-current-icon aria-hidden="true"></i>
                            <span class="theme-toggle-label" data-theme-current-label>Theo hệ thống</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end theme-menu" aria-labelledby="themeMenuButton">
                            <li>
                                <button class="dropdown-item theme-option" type="button" data-theme-option="light"
                                        aria-pressed="false">
                                    <i class="bi bi-sun" aria-hidden="true"></i><span>Sáng</span>
                                    <i class="bi bi-check-lg theme-check" aria-hidden="true"></i>
                                </button>
                            </li>
                            <li>
                                <button class="dropdown-item theme-option" type="button" data-theme-option="dark"
                                        aria-pressed="false">
                                    <i class="bi bi-moon-stars" aria-hidden="true"></i><span>Tối</span>
                                    <i class="bi bi-check-lg theme-check" aria-hidden="true"></i>
                                </button>
                            </li>
                            <li>
                                <button class="dropdown-item theme-option" type="button" data-theme-option="system"
                                        aria-pressed="false">
                                    <i class="bi bi-display" aria-hidden="true"></i><span>Theo hệ thống</span>
                                    <i class="bi bi-check-lg theme-check" aria-hidden="true"></i>
                                </button>
                            </li>
                        </ul>
                    </div>

                    <th:block th:if="${currentUser == null}">
                        <a class="nav-login" th:href="@{/login}">
                            <i class="bi bi-person" aria-hidden="true"></i> Đăng nhập
                        </a>
                        <a class="btn btn-primary btn-nav-cta" th:href="@{/register}">Đăng ký</a>
                    </th:block>

                    <th:block th:if="${currentUser != null}">
                        <a class="nav-login" th:href="@{/profile}" th:title="${currentUser.email}">
                            <i class="bi bi-person-circle" aria-hidden="true"></i>
                            <span th:text="${currentUser.fullName}">Người dùng</span>
                        </a>
                        <div class="dropdown" th:if="${currentUser.role.name() == 'ADMIN'}">
                            <button class="btn nav-admin-toggle dropdown-toggle"
                                    th:classappend="${activeNav == 'admin-dashboard' || activeNav == 'admin-users'} ? 'active' : ''"
                                    type="button" id="adminNavigationMenu"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-shield-lock" aria-hidden="true"></i> Admin
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end theme-menu"
                                aria-labelledby="adminNavigationMenu">
                                <li>
                                    <a class="dropdown-item"
                                       th:classappend="${activeNav == 'admin-dashboard'} ? 'active' : ''"
                                       th:href="@{/admin/dashboard}">
                                        <i class="bi bi-speedometer2 me-2" aria-hidden="true"></i>
                                        Dashboard quản trị
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item"
                                       th:classappend="${activeNav == 'admin-users'} ? 'active' : ''"
                                       th:href="@{/admin/users}">
                                        <i class="bi bi-people me-2" aria-hidden="true"></i>
                                        Quản lý người dùng
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <form class="nav-logout-form" th:action="@{/logout}" method="post">
                            <button class="btn btn-outline-primary" type="submit">
                                <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Đăng xuất
                            </button>
                        </form>
                    </th:block>
                </div>
            </div>
        </div>
    </nav>
    <div class="container flash-container" th:if="${flashMessage}">
        <div class="alert alert-dismissible fade show"
             th:classappend="${flashType == 'success' ? 'alert-success' : (flashType == 'danger' ? 'alert-danger' : (flashType == 'warning' ? 'alert-warning' : 'alert-info'))}"
             role="status" aria-live="polite" aria-atomic="true">
            <i class="bi bi-info-circle me-2" aria-hidden="true"></i>
            <span th:text="${flashMessage}">Thông báo</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
        </div>
    </div>
</div>
</body>
</html>
