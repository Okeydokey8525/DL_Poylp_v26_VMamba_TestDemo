<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Không tìm thấy trang')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="error-main" tabindex="-1">
    <section class="container error-state" aria-labelledby="errorTitle">
        <span class="error-code" aria-hidden="true">404</span>
        <div class="error-icon"><i class="bi bi-compass" aria-hidden="true"></i></div>
        <h1 id="errorTitle">Không tìm thấy trang</h1>
        <p>Đường dẫn có thể đã thay đổi hoặc không còn tồn tại. Không có dữ liệu nội bộ nào được hiển thị.</p>
        <p class="error-request-id" th:if="${requestId != null}">Mã yêu cầu: <code th:text="${requestId}"></code></p>
        <div class="error-actions">
            <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house" aria-hidden="true"></i> Về trang chủ</a>
            <a class="btn btn-outline-primary" th:href="@{/diagnose}">Mở trang phân tích</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
