spring.application.name=polypweb
spring.profiles.default=dev

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.locale=vi_VN
spring.jackson.time-zone=Asia/Ho_Chi_Minh

server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.enabled-by-default=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.cache.time-to-live=5s
management.endpoint.info.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.description=Research interface for colorectal polyp segmentation
info.app.profile=${spring.profiles.active:${spring.profiles.default}}
info.app.java-version=${java.version}

app.storage.max-file-size=10MB
app.storage.max-result-size=15MB
app.security.hsts-enabled=false
