spring.config.activate.on-profile=prod

spring.mongodb.uri=${POLYPVISION_MONGODB_URI}
ai.api.base-url=${POLYPVISION_AI_BASE_URL}
ai.api.connect-timeout=${POLYPVISION_AI_CONNECT_TIMEOUT:3s}
ai.api.read-timeout=${POLYPVISION_AI_READ_TIMEOUT:15s}
ai.api.health-timeout=${POLYPVISION_AI_HEALTH_TIMEOUT:2s}
app.storage.root=${POLYPVISION_STORAGE_ROOT:storage}

spring.thymeleaf.cache=true
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
server.servlet.session.cookie.secure=true
app.security.hsts-enabled=true

logging.level.root=INFO
logging.level.com.polyp.polypweb=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
